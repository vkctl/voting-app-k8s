apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  namespace: default
  labels:
    app: result
spec:
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
        - name: result
          image: ghcr.io/vkctl/result:dev-latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
            readinessProbe:
              httpGet:
                path: /
                port: 80
              initialDelaySeconds: 3
              periodSeconds: 5
              failureThreshold: 3
            livenessProbe:
              httpGet:
                path: /
                port: 80
              initialDelaySeconds: 10
              periodSeconds: 10
              failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: result
  namespace: default
  labels:
    app: result
spec:
  type: LoadBalancer
  selector:
    app: result
  ports:
    - name: http
      port: 80
      targetPort: 80
