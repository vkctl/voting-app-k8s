name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.actor }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout code
        uses: actions/Checkout@v7
        with:
          fetch-depth: 0

      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target version
        id: vars
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Retag existing version as the release version
        run: |
          SERVICES=(vote worker result)
          for svc in "${SERVICES[@]}"; do
            SVC_SHA=$(git log -1 --format=%h -- "app/$svc")
            if [[ -z "$SVC_SHA "]]; then
              echo "::error::No commit found touching app/$svc — can't resolve an image"
              exit 1
            fi

            SRC="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/$svc:$SVC_SHA"
            DEST="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/$svc:${{ steps.vars.outputs.version }}"

            echo "==> $svc last changed at $SVC_SHA - pulling $SRC"
            docker pull "$SRC"

            echo "==> tagging as $DEST"
            docker tag "$SRC" "$DEST"
            docker push "$DEST"
          done
